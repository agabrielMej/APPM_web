<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>F1 Blog</title>

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/componenets.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h1>F1 Blog</h1>
        <nav>
            <button id="home-btn">Inicio</button>            
            <button>Crear</button>
            <button>Favoritos</button>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h2>La emoción de la Fórmula 1</h2>
            <p>
                Noticias, análisis y pasión por el automovilismo.
            </p>
        </div>
    </section>

    <!-- BUSCADOR -->
    <section class="filters">
        <input type="text" id="search" placeholder="Buscar publicación...">
    </section>

    <main id="posts-container" class="grid"></main>

    <section id="drivers-section">
        <h2>Pilotos actuales</h2>
        <div id="drivers-container" class="grid"></div>
    </section>

    <script type="module" src="./js/main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>F1 Blog</title>

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/componenets.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h1>🏎️ F1 Blog</h1>

        <nav>

            <button id="favorites-btn">Favoritos</button>

    <section class="filters">
        <input type="text" id="search" placeholder="Buscar post...">

    <!-- CONTENEDOR POSTS -->
    <main id="posts-container" class="grid"></main>

    <!-- MENSAJES -->
    <div id="message"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
